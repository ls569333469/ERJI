# Include ONLY inside the existing xiexiu.io HTTPS server after inspection.
# Keep the existing /xbot/ and /tg/ locations and TLS configuration.
location = /erji {
    return 308 /erji/$is_args$args;
}
location = /erji/v1/stream {
    proxy_pass http://127.0.0.1:18770;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    access_log /var/log/nginx/erji-access.log;
    error_log /var/log/nginx/erji-error.log;
}
location ^~ /erji/ {
    # No URI suffix: preserve /erji for Next.js basePath.
    proxy_pass http://127.0.0.1:18770;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Also covers stream/ if requested with a trailing slash.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    access_log /var/log/nginx/erji-access.log;
    error_log /var/log/nginx/erji-error.log;
}
